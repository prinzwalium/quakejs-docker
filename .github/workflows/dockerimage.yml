name: Docker Image CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build test image
      uses: docker/build-push-action@v7
      with:
          context: .
          load: true
          tags: quakejs:test

    # Starts the image and checks nginx, the game server and the admin interface
    - name: Smoke test
      run: sh .github/smoke-test.sh quakejs:test

    # Only log in and push for commits on master; pull requests just build the image.
    - name: Login to DockerHub
      if: github.event_name == 'push'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: prinzwalium/quakejs
