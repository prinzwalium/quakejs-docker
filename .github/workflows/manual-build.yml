name: Manual Docker Image Build

# Run from the Actions tab ("Run workflow"), choosing the branch to build.
# The image is pushed to Docker Hub as prinzwalium/quakejs:<tag>, where <tag> defaults
# to the branch name (with "/" replaced by "-"), so it never overwrites "latest".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (leave empty to use the branch name)'
        required: false
        default: ''
      push:
        description: 'Push the image to Docker Hub'
        type: boolean
        required: false
        default: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Determine image tag
      id: tag
      env:
        INPUT_TAG: ${{ inputs.tag }}
        BRANCH: ${{ github.ref_name }}
      run: |
        tag="${INPUT_TAG:-$BRANCH}"
        # Docker tags allow [A-Za-z0-9_.-], max 128 chars, and must not start with '.' or '-'
        tag="$(printf '%s' "$tag" | tr '/' '-' | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[.-]*//' | cut -c1-128)"
        if [ -z "$tag" ] || [ "$tag" = "latest" ]; then
          echo "::error::Invalid tag '$tag' (empty, or 'latest' which is reserved for master)"
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "Image: prinzwalium/quakejs:$tag" >> "$GITHUB_STEP_SUMMARY"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build test image
      uses: docker/build-push-action@v7
      with:
          context: .
          load: true
          tags: quakejs:test

    # Starts the image and checks nginx, the game server and the admin interface
    - name: Smoke test
      run: sh .github/smoke-test.sh quakejs:test

    - name: Login to DockerHub
      if: inputs.push
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
          context: .
          push: ${{ inputs.push }}
          tags: prinzwalium/quakejs:${{ steps.tag.outputs.tag }}
