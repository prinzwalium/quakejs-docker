[supervisord]
user=root
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:nginx]
user=root
priority=10
command=/usr/sbin/nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:quakejs]
user=quakejs
priority=20
directory=/quakejs
; fs_cdn points the server at the container's own nginx for manifest.json and the
; game assets, instead of its compiled-in default (content.quakejs.com).
command=node /quakejs/build/ioq3ded.js +set fs_cdn 127.0.0.1:80 +set fs_game baseq3 set dedicated 1 +exec server.cfg
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
