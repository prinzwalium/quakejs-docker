[supervisord]
user=root
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Control socket used by the admin interface (runs as quakejs) to restart the game server.
[unix_http_server]
file=/run/supervisord.sock
chmod=0700
chown=quakejs:quakejs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:nginx]
user=root
priority=10
command=/usr/sbin/nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:quakejs]
user=quakejs
priority=20
directory=/quakejs
; fs_cdn points the server at the container's own nginx for manifest.json and the
; game assets, instead of its compiled-in default (content.quakejs.com).
; server.cfg and settings.cfg are generated from /data/settings.json (see admin/).
; TRUSTED_PROXIES (inherited from the container environment) lets it see players' real addresses.
command=node /quakejs/build/ioq3ded.js +set fs_cdn 127.0.0.1:80 +set fs_game baseq3 set dedicated 1 +exec server.cfg
environment=HOME="/quakejs",ADMIN_PASSWORD="",RCON_PASSWORD=""
autorestart=true
startretries=10
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:admin]
user=quakejs
priority=30
directory=/quakejs/admin
command=node /quakejs/admin/server.js
environment=HOME="/quakejs"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
