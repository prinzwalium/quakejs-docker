# Keep the protocol the client used when this container sits behind an HTTPS reverse proxy.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80 default_server;

  root /var/www/html;
  index index.html;
  server_name _;
  server_tokens off;

  # When the game ends with an error (e.g. kicked), the client POSTs the error to "/".
  # Show a small page with "Rejoin" / "Change player" instead of nginx's 405 page.
  error_page 405 =200 /disconnected.html;

  location / {
    try_files /nonexistent @$http_upgrade;
  }

  location @ {
    try_files $uri $uri/ =404;
  }

  location @websocket {
      proxy_pass http://localhost:27960;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # The game server takes the player's address from here (see TRUSTED_PROXIES).
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Admin interface and public stats page (admin/server.js, listens on localhost only)
  location = /admin {
    return 301 /admin/;
  }

  location = /stats {
    return 301 /stats/;
  }

  location ~ ^/(admin|stats)/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
    # Backups can be a few MB; admin/server.js limits every other request to 64 KB.
    client_max_body_size 6m;
    proxy_read_timeout 90s;
  }
}
